<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Currency Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --page-bg: #DEDBD3;
            --paper: #F7F6F3;
            --ink: #14202B;
            --signal: #2B6E68;
            --muted: #6B7680;
            --line: #D8D3C7;
            --error: #A8402A;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #0D1418;
                --paper: #172128;
                --ink: #F2F1EC;
                --signal: #57B3A8;
                --muted: #8FA6A2;
                --line: #2C3A40;
                --error: #E08877;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--page-bg);
            color: var(--ink);
            font-family: 'IBM Plex Mono', monospace;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--paper);
            border-radius: 4mm;
            padding: 10mm 9mm;
            box-shadow: 0 2px 10px rgba(20, 32, 43, 0.18);
        }
        h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20pt;
            letter-spacing: -0.01em;
            line-height: 1.15;
        }
        .tagline {
            font-size: 8pt;
            color: var(--signal);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 1.5mm;
        }
        .signal-line {
            width: 100%;
            height: 6mm;
            margin: 4mm 0;
        }
        .signal-line polyline {
            stroke: var(--signal);
        }
        label {
            display: block;
            font-size: 7.5pt;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .field {
            margin-bottom: 16px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 2mm;
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--ink);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1rem;
        }
        input[type="number"]:focus, select:focus {
            outline: 2px solid var(--signal);
            outline-offset: -1px;
        }
        .fields-row {
            display: flex;
            align-items: end;
            gap: 8px;
            margin-bottom: 20px;
        }
        .fields-row .field { flex: 1; margin-bottom: 0; }
        .swap-btn {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 2mm;
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--signal);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }
        .swap-btn:hover { background: var(--line); }
        .swap-btn:active { transform: rotate(180deg); }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 2mm;
            background: var(--signal);
            color: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5pt;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
        button[type="submit"]:hover { opacity: 0.9; }
        button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
        .result {
            margin-top: 20px;
            padding: 5mm;
            border-radius: 2mm;
            background: var(--paper);
            border: 1px solid var(--line);
            min-height: 24px;
        }
        .result.hidden { display: none; }
        .result .amount {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ink);
        }
        .result .meta {
            margin-top: 4px;
            font-size: 7.5pt;
            color: var(--muted);
        }
        .result.error {
            color: var(--error);
            border-color: var(--error);
        }
        .caption {
            font-size: 7.5pt;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 20px 0 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table.hidden { display: none; }
        table.hidden + .caption { display: none; }
        th, td {
            padding: 8px 4px;
            text-align: right;
            border-bottom: 1px solid var(--line);
            font-variant-numeric: tabular-nums;
        }
        th:first-child, td:first-child {
            text-align: left;
        }
        th {
            font-size: 7pt;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Currency Calculator</h1>
        <div class="tagline">Live rates &middot; Frankfurter API</div>

        <svg class="signal-line" viewBox="0 0 300 24" preserveAspectRatio="none">
            <polyline points="0,12 40,12 46,4 52,20 58,12 100,12 106,6 112,18 118,12 170,12 176,3 182,21 188,12 240,12 246,7 252,17 258,12 300,12"
                fill="none" stroke-width="1.4" opacity="0.7" />
        </svg>

        <form id="convert-form">
            <div class="field">
                <label for="amount">Amount</label>
                <input type="number" id="amount" value="1" min="0" step="any" required>
            </div>

            <div class="fields-row">
                <div class="field">
                    <label for="from">From</label>
                    <select id="from" required></select>
                </div>
                <button type="button" class="swap-btn" id="swap" title="Swap currencies" aria-label="Swap currencies">&#8646;</button>
                <div class="field">
                    <label for="to">To</label>
                    <select id="to" required></select>
                </div>
            </div>

            <button type="submit" id="submit-btn">Convert</button>
        </form>

        <div class="result hidden" id="result"></div>

        <div class="caption">Powers of 10</div>
        <table class="hidden" id="powers-table">
            <thead>
                <tr>
                    <th id="powers-from-header">From</th>
                    <th id="powers-to-header">To</th>
                </tr>
            </thead>
            <tbody id="powers-body"></tbody>
        </table>
    </div>

    <script>
        const fromSelect = document.getElementById('from');
        const toSelect = document.getElementById('to');
        const form = document.getElementById('convert-form');
        const submitBtn = document.getElementById('submit-btn');
        const resultEl = document.getElementById('result');
        const swapBtn = document.getElementById('swap');
        const powersTable = document.getElementById('powers-table');
        const powersBody = document.getElementById('powers-body');
        const powersFromHeader = document.getElementById('powers-from-header');
        const powersToHeader = document.getElementById('powers-to-header');

        const POWERS_OF_TEN = [1, 10, 100, 1000, 10000, 100000, 1000000];

        function showResult(html, isError) {
            resultEl.innerHTML = html;
            resultEl.classList.remove('hidden');
            resultEl.classList.toggle('error', Boolean(isError));
        }

        function renderPowersTable(from, to, rate) {
            powersFromHeader.textContent = from;
            powersToHeader.textContent = to;
            powersBody.innerHTML = POWERS_OF_TEN.map((power) => `
                <tr>
                    <td>${power.toLocaleString()}</td>
                    <td>${(power * rate).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
                </tr>
            `).join('');
            powersTable.classList.remove('hidden');
        }

        async function loadCurrencies() {
            try {
                const response = await fetch('/currencies');
                const currencies = await response.json();
                for (const { code, name } of currencies) {
                    const option = `<option value="${code}">${code} &mdash; ${name}</option>`;
                    fromSelect.insertAdjacentHTML('beforeend', option);
                    toSelect.insertAdjacentHTML('beforeend', option);
                }
                fromSelect.value = 'JPY';
                toSelect.value = 'EUR';
                updatePowersTable();
            } catch (err) {
                showResult('Could not load currency list: ' + err.message, true);
            }
        }

        async function updatePowersTable() {
            const from = fromSelect.value;
            const to = toSelect.value;
            if (!from || !to) return;

            try {
                const response = await fetch(`/convert?amount=1&from=${from}&to=${to}`);
                if (!response.ok) return;
                const data = await response.json();
                renderPowersTable(data.from, data.to, data.rate);
            } catch (err) {
                // leave the table as-is; the convert form will surface any real errors
            }
        }

        fromSelect.addEventListener('change', updatePowersTable);
        toSelect.addEventListener('change', updatePowersTable);

        swapBtn.addEventListener('click', () => {
            const tmp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = tmp;
            updatePowersTable();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('amount').value;
            const from = fromSelect.value;
            const to = toSelect.value;

            submitBtn.disabled = true;
            showResult('Converting&hellip;', false);

            try {
                const response = await fetch(`/convert?amount=${encodeURIComponent(amount)}&from=${from}&to=${to}`);
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    showResult(error.message || response.statusText, true);
                    return;
                }
                const data = await response.json();
                showResult(`
                    <div class="amount">${data.amount} ${data.from} = ${data.convertedAmount.toFixed(2)} ${data.to}</div>
                    <div class="meta">1 ${data.from} = ${data.rate.toFixed(6)} ${data.to} &middot; as of ${data.date}</div>
                `, false);
                renderPowersTable(data.from, data.to, data.rate);
            } catch (err) {
                showResult('Error: ' + err.message, true);
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadCurrencies();
    </script>
</body>
</html>
