name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database and role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE currency_calculator_test;"
          psql -h localhost -U postgres -c "CREATE USER currency_test WITH PASSWORD 'currency_test';"
          psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE currency_calculator_test TO currency_test;"
          psql -h localhost -U postgres -c "ALTER DATABASE currency_calculator_test OWNER TO currency_test;"

      # Skips the Angular build entirely (see the frontend job below) so this job only fails
      # on real backend issues, not frontend build flakiness, and runs faster.
      - name: Run backend tests
        run: ./mvnw test -B -Dfrontend.skip=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: npx ng test --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
