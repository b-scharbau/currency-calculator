name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database and role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE currency_calculator_test;"
          psql -h localhost -U postgres -c "CREATE USER currency_test WITH PASSWORD 'currency_test';"
          psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE currency_calculator_test TO currency_test;"
          psql -h localhost -U postgres -c "ALTER DATABASE currency_calculator_test OWNER TO currency_test;"

      # Skips the Angular build entirely (see the frontend job below) so this job only fails
      # on real backend issues, not frontend build flakiness, and runs faster.
      - name: Run backend tests
        run: ./mvnw test -B -Dfrontend.skip=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      # CI runners execute as root, and Chrome refuses its normal sandbox in that case ("No usable
      # sandbox"). ChromeHeadlessNoSandbox is a launcher Angular's own default Karma config already
      # ships (adds --no-sandbox --disable-gpu --disable-dev-shm-usage) for exactly this situation.
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: 768664385987.dkr.ecr.ap-northeast-1.amazonaws.com/currency-calculator
      ECS_CLUSTER: currency-calculator
      ECS_SERVICE: currency-calculator
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: decode just the aud/sub claims (never the full token) to debug an
      # AssumeRoleWithWebIdentity authorization failure. Remove once resolved.
      - name: Debug OIDC claims
        run: |
          python3 -c "import json, base64, os, urllib.request; url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'; req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}); tok = json.load(urllib.request.urlopen(req))['value']; p = tok.split('.')[1]; p += '=' * (-len(p) % 4); claims = json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k: claims.get(k) for k in ('aud', 'sub', 'iss', 'repository', 'ref')}, indent=2))"

      # Scoped via OIDC (see infra/github_oidc.tf) to this exact repo+branch, and to only pushing
      # images to this one ECR repo and rolling this one ECS service — no long-lived AWS credentials
      # stored anywhere.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768664385987:role/currency-calculator-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t "$ECR_REPOSITORY:latest" -t "$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$ECR_REPOSITORY:latest"
          docker push "$ECR_REPOSITORY:${{ github.sha }}"

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --region "$AWS_REGION" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --region "$AWS_REGION"
